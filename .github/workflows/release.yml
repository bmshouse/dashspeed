name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Release APK and Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Run unit tests
        run: ./gradlew test

      - name: Set up release signing config
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > dashspeed-release-key.keystore
          echo "storePassword=$RELEASE_KEYSTORE_PASSWORD" > signing.properties
          echo "keyPassword=$RELEASE_KEY_PASSWORD" >> signing.properties

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Remove signing files
        if: always()
        run: rm -f dashspeed-release-key.keystore signing.properties

      - name: Rename APK with version tag
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/dashspeed-${{ github.ref_name }}-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/dashspeed-${{ github.ref_name }}-release.apk
          generate_release_notes: true
